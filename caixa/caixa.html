<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caixa Diário</title>
    <link rel="stylesheet" href="caixa.css" />
  </head>
  <body>
    <main>
      <h1>Caixa Diário</h1>

      <form id="formVenda">
        <div>
          <label for="data">Data da Venda</label>
          <input type="date" id="data" required />
        </div>

        <div>
          <label for="produto">Produto</label>
          <input
            type="text"
            id="produto"
            placeholder="Ex: Camiseta, Café, Serviço..."
            required
          />
        </div>

        <div>
          <label for="valor">Valor (R$)</label>
          <input
            type="number"
            id="valor"
            placeholder="0.00"
            step="0.01"
            min="0.01"
            required
          />
        </div>

        <div>
          <label for="pagamento">Forma de Pagamento</label>
          <select id="pagamento" required>
            <option value="" disabled selected>Selecione uma opção</option>
            <option value="pix">PIX</option>
            <option value="debito">Cartão Débito</option>
            <option value="credito">Cartão Crédito</option>
            <option value="dinheiro">Dinheiro</option>
          </select>
        </div>

        <button type="submit" id="adicionar">Adicionar Venda</button>
      </form>

      <section>
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Produto</th>
              <th>Valor</th>
              <th>Pagamento</th>
              <th>Ação</th>
            </tr>
          </thead>
          <tbody id="listaVendas">
            <!-- As vendas serão inseridas aqui via JavaScript -->
          </tbody>
        </table>
      </section>

      <section>
        <h2>Resumo do Caixa</h2>
        <p>Total em PIX: <span id="totalPix">R$ 0,00</span></p>
        <p>Total em Débito: <span id="totalDebito">R$ 0,00</span></p>
        <p>Total em Crédito: <span id="totalCredito">R$ 0,00</span></p>
        <p>Total em Dinheiro: <span id="totalDinheiro">R$ 0,00</span></p>
        <hr />
        <p>
          <strong>Total Geral: <span id="totalGeral">R$ 0,00</span></strong>
        </p>
      </section>
    </main>
  </body>
</html>
