<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Somando valores</h1>
    <input type="number" name="txtn1" id="txtn1" /> +
    <input type="number" name="txtn2" id="txtn2" />
    <input type="button" value="Somar" id="btnsoma" />
    <p>O resultado da soma é <strong id="res">0</strong></p>
    <script>
      var soma = document.querySelector("input#btnsoma");
      soma.addEventListener("click", somar);

      function somar() {
        var n1 = Number(document.querySelector("input#txtn1").value);
        var n2 = Number(document.querySelector("input#txtn2").value);
        var res = n1 + n2;
        document.querySelector("strong#res").innerHTML = res;
      }
    </script>
  </body>
</html>
