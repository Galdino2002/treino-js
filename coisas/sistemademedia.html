<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Média</title>
  </head>
  <body>
    <h1>Sistema de Média Escolar</h1>

    <label for="nome">Nome do Aluno:</label>
    <input type="text" id="nome" />
    <br /><br />

    <label for="nota1">Primeira Nota:</label>
    <input type="number" id="nota1" />
    <br /><br />

    <label for="nota2">Segunda Nota:</label>
    <input type="number" id="nota2" />
    <br /><br />

    <button id="calcular">Calcular Média</button>

    <hr />

    <h2>Resultado</h2>

    <p>Aluno: <span id="resultadoNome"></span></p>
    <p>Média: <span id="resultadoMedia"></span></p>
    <p>Situação: <span id="resultadoSituacao"></span></p>

    <script>
      const botao = document.getElementById("calcular");

      botao.addEventListener("click", calcularMedia);

      function calcularMedia() {
        const nome = document.getElementById("nome").value;
        const nota1 = Number(document.getElementById("nota1").value);
        const nota2 = Number(document.getElementById("nota2").value);

        const media = (nota1 + nota2) / 2;

        document.getElementById("resultadoNome").textContent = nome;
        document.getElementById("resultadoMedia").textContent = media
          .toFixed(2)
          .replace(".", ",");

        if (media >= 7) {
          document.getElementById("resultadoSituacao").textContent = "Aprovado";
        } else if (media >= 5) {
          document.getElementById("resultadoSituacao").textContent =
            "Recuperação";
        } else {
          document.getElementById("resultadoSituacao").textContent =
            "Reprovado";
        }
      }
    </script>
  </body>
</html>
