<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Locadora de Veículos</title>
    <link rel="stylesheet" href="locadora.css" />
  </head>
  <body>
    <main>
      <h1>Locadora de Veículos</h1>

      <form id="form-locadora">
        <!-- 1. Dados do Cliente -->
        <fieldset>
          <legend>1. Dados do Cliente</legend>

          <div>
            <label for="nome">Nome Completo</label>
            <input
              type="text"
              id="nome"
              placeholder="Digite seu nome"
              required
            />
          </div>

          <div>
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" required />
          </div>
        </fieldset>

        <!-- 2. Escolha do Veículo -->
        <fieldset>
          <legend>2. Escolha o Veículo</legend>

          <div>
            <input
              type="radio"
              id="veiculo-popular"
              name="veiculo"
              value="120"
              required
            />
            <label for="veiculo-popular">Popular - R$ 120/dia</label>
          </div>

          <div>
            <input type="radio" id="veiculo-sedan" name="veiculo" value="180" />
            <label for="veiculo-sedan">Sedan - R$ 180/dia</label>
          </div>

          <div>
            <input type="radio" id="veiculo-suv" name="veiculo" value="260" />
            <label for="veiculo-suv">SUV - R$ 260/dia</label>
          </div>
        </fieldset>

        <!-- 3. Detalhes da Locação -->
        <fieldset>
          <legend>3. Detalhes da Locação</legend>

          <div>
            <label for="dias">Quantidade de Dias</label>
            <input
              type="number"
              id="dias"
              min="1"
              placeholder="Ex: 3"
              required
            />
          </div>

          <div>
            <label for="km">Quilômetros Percorridos</label>
            <input
              type="number"
              id="km"
              min="0"
              placeholder="Ex: 150"
              required
            />
          </div>
        </fieldset>

        <!-- 4. Serviços Adicionais -->
        <fieldset>
          <legend>4. Serviços Adicionais</legend>

          <div>
            <input type="checkbox" id="extra-gps" name="extra" value="20" />
            <label for="extra-gps">GPS (R$ 20/dia)</label>
          </div>

          <div>
            <input type="checkbox" id="extra-cadeira" name="extra" value="15" />
            <label for="extra-cadeira">Cadeira Infantil (R$ 15/dia)</label>
          </div>

          <div>
            <input type="checkbox" id="extra-seguro" name="extra" value="60" />
            <label for="extra-seguro">Seguro Completo (R$ 60/dia)</label>
          </div>
        </fieldset>

        <!-- 5. Pagamento -->
        <fieldset>
          <legend>5. Pagamento</legend>

          <div>
            <label for="pagamento">Forma de Pagamento</label>
            <select id="pagamento" required>
              <option value="">Selecione uma opção</option>
              <option value="dinheiro">Dinheiro</option>
              <option value="pix">PIX</option>
              <option value="debito">Cartão de Débito</option>
              <option value="credito">Cartão de Crédito</option>
            </select>
          </div>
        </fieldset>

        <button type="button" id="calcular">Calcular Locação</button>
      </form>

      <!-- Resumo -->
      <section id="resultado">
        <h2>Resumo da Locação</h2>
        <p>Preencha os campos acima para calcular o valor total.</p>
      </section>
    </main>

    <script src="locadora.js"></script>
  </body>
</html>
