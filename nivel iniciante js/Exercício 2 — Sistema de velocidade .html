<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Exercício 2 — Sistema de velocidade 🚗</h1>
    <div>
      <input type="number" id="Number1" placeholder="digite a velocidade" />
      <input
        type="button"
        id="Resultado"
        value="Verificar vel"
        onclick="verificarVelocidade()"
      /><br />
      <div id="resultado"></div>

      <script>
        function verificarVelocidade() {
          let vel = Number(document.querySelector("#Number1").value);
          let resultado = document.querySelector("#resultado");
          if (vel < 0) {
            resultado.innerHTML = `não aceitamos vel negativa (erro)`;
          } else if (vel <= 60) {
            resultado.innerHTML = `velocidade da pista é de 60km/h e voce está a ${vel}km/h (permitido)`;
          } else if (vel <= 80) {
            resultado.innerHTML = `velocidade da pista é de 60km/h e voce está a ${vel} (ATENÇÃO)`;
          } else {
            resultado.innerHTML = `velocidade da pista é de 60km/h e voce está a ${vel} (MULTADO)`;
          }
        }
      </script>
    </div>
  </body>
</html>
